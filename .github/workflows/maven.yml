name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-urlshortener:
    runs-on: ubuntu-latest
    name: Test URL Shortener Service

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Test urlshortener
      run: mvn -B test --file urlshortener/pom.xml
      env:
        SPRING_PROFILES_ACTIVE: test

  test-user-service:
    runs-on: ubuntu-latest
    name: Test User Service

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Test user-service
      run: mvn -B test --file user-service/pom.xml
      env:
        SPRING_PROFILES_ACTIVE: test

  test-statistics-service:
    runs-on: ubuntu-latest
    name: Test Statistics Service

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Test statistics-service
      run: mvn -B test --file statistics-service/pom.xml
      env:
        SPRING_PROFILES_ACTIVE: test

  build:
    runs-on: ubuntu-latest
    needs: [test-urlshortener, test-user-service, test-statistics-service]
    name: Build All Services

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build urlshortener
      run: mvn -B package -DskipTests --file urlshortener/pom.xml

    - name: Build user-service
      run: mvn -B package -DskipTests --file user-service/pom.xml

    - name: Build statistics-service
      run: mvn -B package -DskipTests --file statistics-service/pom.xml

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
