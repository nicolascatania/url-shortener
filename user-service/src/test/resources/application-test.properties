spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Disable OpenTelemetry during tests (Spring Boot 4 properties)
management.opentelemetry.tracing.export.enabled=false
management.opentelemetry.instrumentation.micrometer.enabled=false
spring.application.name=user-service-test

# Disable RabbitMQ auto-start during unit tests (will use mocks)
spring.rabbitmq.listener.simple.auto-startup=false
