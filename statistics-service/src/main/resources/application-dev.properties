spring.application.name=statistics-service
server.port=8082

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/statistics_db
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Logging
logging.level.com.ncatania.statisticsservice=INFO

# === TRACING CONFIGURATION ===
management.tracing.sampling.probability=1.0
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# RabbitMQ Observability
management.observations.key-values.rabbitmq.enabled=true

# banner
spring.banner.location=banner.txt
